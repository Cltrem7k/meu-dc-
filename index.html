<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Discord Clone</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #36393f; color: white; display: flex; height: 100vh; overflow: hidden; }
        
        /* Barra Lateral (Canais) */
        .sidebar { width: 240px; background-color: #2f3136; padding: 20px 10px; display: flex; flex-direction: column; }
        .server-name { font-weight: bold; font-size: 16px; margin-bottom: 20px; padding: 0 10px; border-bottom: 1px solid #202225; padding-bottom: 15px;}
        .channel { padding: 10px; margin: 5px 0; border-radius: 5px; cursor: pointer; color: #8e9297; font-weight: bold; display: flex; align-items: center; gap: 10px; transition: 0.2s;}
        .channel:hover { background-color: #393c43; color: white; }
        .channel.active { background-color: #42464d; color: white; }
        
        /* Área Principal */
        .main { flex: 1; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #202225; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .link-box input { width: 300px; padding: 8px; border-radius: 5px; border: none; background: #40444b; color: white; }
        
        button { background-color: #5865f2; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #4752c4; }
        button.danger { background-color: #ed4245; }
        
        /* Grid de Vídeo */
        .video-grid { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        .video-box { background: #202225; padding: 10px; border-radius: 8px; width: 400px; }
        video { width: 100%; border-radius: 5px; background: black; aspect-ratio: 16/9; object-fit: cover; }
        .controls { display: flex; gap: 10px; margin-top: 10px; justify-content: center; }
        
        #status { color: #faa61a; font-weight: bold; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="server-name">Meu Servidor</div>
        <div class="channel active" onclick="joinChannel('geral')">🔊 Geral</div>
        <div class="channel" onclick="joinChannel('jogos')">🔊 Jogos</div>
        <div class="channel" onclick="joinChannel('musica')">🔊 Música</div>
    </div>

    <div class="main">
        <div class="header">
            <div>
                <span id="status">⏳ Desconectado</span>
            </div>
            <div class="link-box">
                Convite: <input type="text" id="inviteLink" readonly onclick="this.select()">
            </div>
        </div>

        <div class="controls" style="margin-bottom: 20px;">
            <button id="btnMic" onclick="toggleMic()">🎤 Mutar Microfone</button>
            <button id="btnScreen" onclick="shareScreen()">💻 Transmitir Tela</button>
        </div>

        <div class="video-grid">
            <div class="video-box" id="boxLocal" style="display: none;">
                <h3 style="margin-top:0; font-size: 14px; color: #b9bbbe;">Sua Tela</h3>
                <video id="localVideo" autoplay playsinline muted></video>
            </div>

            <div class="video-box" id="boxRemote" style="display: none;">
                <h3 style="margin-top:0; font-size: 14px; color: #b9bbbe;">Tela do Amigo</h3>
                <video id="remoteVideo" autoplay playsinline></video>
                <div style="margin-top: 10px; text-align: center; color:#b9bbbe; font-size:12px;">
                    Volume da Live: <input type="range" min="0" max="1" step="0.1" value="1" oninput="document.getElementById('remoteVideo').volume = this.value">
                </div>
            </div>
        </div>

        <!-- Áudio Oculto -->
        <audio id="remoteAudio" autoplay></audio>
        <div id="audioControls" style="display: none; margin-top:20px; text-align:center; color:#b9bbbe; font-size:12px;">
            Volume da Voz: <input type="range" min="0" max="1" step="0.1" value="1" oninput="document.getElementById('remoteAudio').volume = this.value">
        </div>
    </div>

    <script>
        let peer = null;
        let localMic = null;
        let localScreen = null;
        let currentRoom = null;
        
        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        async function initMic() {
            try {
                if(!localMic) localMic = await navigator.mediaDevices.getUserMedia({ audio: true });
            } catch(e) {
                console.warn("Microfone sem permissão.");
            }
        }

        async function joinChannel(channelName) {
            document.querySelectorAll('.channel').forEach(c => c.classList.remove('active'));
            event.currentTarget.classList.add('active');

            document.getElementById('status').innerText = "🔄 Conectando ao " + channelName + "...";
            document.getElementById('status').style.color = "#faa61a";
            
            await initMic();

            if(peer) peer.destroy(); // Reseta a conexão anterior

            peer = new Peer(config);

            peer.on('open', (id) => {
                const urlParams = new URLSearchParams(window.location.search);
                const hostId = urlParams.get('server');
                
                if (!hostId) {
                    // Eu sou o dono do servidor
                    const link = window.location.origin + window.location.pathname + "?server=" + id;
                    document.getElementById('inviteLink').value = link;
                    document.getElementById('status').innerText = "✅ Conectado (" + channelName + ")";
                    document.getElementById('status').style.color = "#43b581";
                } else {
                    // Eu sou o convidado
                    document.getElementById('inviteLink').value = window.location.href;
                    connectToHost(hostId);
                }
            });

            peer.on('call', handleCall);
            peer.on('disconnected', () => peer.reconnect());
        }

        function connectToHost(hostId) {
            const call = peer.call(hostId, localMic, { metadata: { type: 'voice' }});
            if(call) handleCall(call);
        }

        function handleCall(call) {
            if(!localMic) return;
            call.answer(localMic);

            call.on('stream', (stream) => {
                document.getElementById('status').innerText = "🟢 Chamada Ativa!";
                document.getElementById('status').style.color = "#43b581";

                if (call.metadata && call.metadata.type === 'screen') {
                    const vid = document.getElementById('remoteVideo');
                    vid.srcObject = stream;
                    document.getElementById('boxRemote').style.display = 'block';
                    vid.play().catch(e => console.log("Aguardando clique para tocar vídeo."));
                } else {
                    document.getElementById('remoteAudio').srcObject = stream;
                    document.getElementById('audioControls').style.display = 'block';
                }
            });

            call.on('close', () => {
                document.getElementById('boxRemote').style.display = 'none';
                document.getElementById('status').innerText = "❌ Amigo saiu.";
                document.getElementById('status').style.color = "#ed4245";
            });
        }

        async function shareScreen() {
            try {
                localScreen = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localScreen;
                document.getElementById('boxLocal').style.display = 'block';
                
                document.getElementById('btnScreen').innerText = "🛑 Parar Tela";
                document.getElementById('btnScreen').classList.add('danger');

                // Atualiza a tela para todos conectados com a tag 'screen'
                if(peer && !peer.disconnected) {
                    Object.values(peer.connections).forEach(conns => {
                        conns.forEach(conn => {
                            if(conn.peer) peer.call(conn.peer, localScreen, { metadata: { type: 'screen' }});
                        });
                    });
                }

                localScreen.getVideoTracks()[0].onended = stopScreen;
            } catch(e) { console.error(e); }
        }

        function stopScreen() {
            if(localScreen) localScreen.getTracks().forEach(t => t.stop());
            document.getElementById('boxLocal').style.display = 'none';
            const btn = document.getElementById('btnScreen');
            btn.innerText = "💻 Transmitir Tela";
            btn.classList.remove('danger');
        }

        function toggleMic() {
            if(localMic) {
                const track = localMic.getAudioTracks()[0];
                track.enabled = !track.enabled;
                const btn = document.getElementById('btnMic');
                btn.innerText = track.enabled ? "🎤 Mutar Microfone" : "🎤 Desmutar";
                btn.classList.toggle('danger');
            }
        }

        // Inicia automaticamente no canal Geral
        window.onload = () => joinChannel('geral');
    </script>
</body>
</html>
