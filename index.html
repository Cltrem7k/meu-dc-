<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Clone P2P - Salas</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #36393f; color: white; margin: 0; padding: 20px; text-align: center; }
        h1 { margin-bottom: 5px; color: #7289da; }
        .container { max-width: 900px; margin: 0 auto; background: #2f3136; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        
        /* Telas (Lobby e Sala) */
        #lobby { display: block; padding: 40px 20px; }
        #room { display: none; }

        .link-box { background: #202225; padding: 15px; border-radius: 8px; margin: 15px 0; word-break: break-all; }
        .link-box input { width: 80%; padding: 10px; border: none; border-radius: 5px; background: #40444b; color: white; margin-top: 10px; font-size: 14px; text-align: center;}
        
        button { background-color: #7289da; color: white; border: none; padding: 12px 24px; margin: 5px; border-radius: 5px; cursor: pointer; font-size: 15px; font-weight: bold; transition: 0.2s; }
        button:hover { background-color: #5b6eae; }
        button.danger { background-color: #ed4245; }
        button.danger:hover { background-color: #c03537; }
        button.success { background-color: #43b581; font-size: 18px; padding: 15px 30px; }
        
        .video-grid { display: flex; gap: 15px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        .video-box { background: #202225; padding: 10px; border-radius: 8px; width: 100%; max-width: 420px; }
        .video-box h3 { font-size: 14px; color: #b9bbbe; margin-top: 0; margin-bottom: 10px; }
        video { width: 100%; background: #000; border-radius: 5px; aspect-ratio: 16/9; object-fit: cover; }
        
        #status { color: #faa61a; font-weight: bold; margin-bottom: 15px; background: #292b2f; padding: 10px; border-radius: 5px; }
        .text-success { color: #43b581 !important; }
        .text-error { color: #ed4245 !important; }

        .volume-control { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; background: #292b2f; padding: 8px; border-radius: 5px; }
        .volume-control label { font-size: 12px; color: #b9bbbe; font-weight: bold;}
        input[type=range] { width: 100px; accent-color: #7289da; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Meu Servidor de Voz e Tela</h1>

        <!-- PÁGINA INICIAL (LOBBY) -->
        <div id="lobby">
            <h3>Bem-vindo! Crie uma sala para convidar seus amigos.</h3>
            <button class="success" onclick="startApp(false)">➕ Criar Nova Sala</button>
        </div>

        <!-- DENTRO DA SALA -->
        <div id="room">
            <div id="status">⏳ Inicializando microfone e conexões...</div>

            <div class="link-box">
                <strong>Envie este link para seu amigo entrar nesta sala:</strong><br>
                <input type="text" id="inviteLink" readonly onclick="this.select()">
            </div>

            <div class="controls">
                <button id="btnMic" onclick="toggleMic()">🎤 Mutar Meu Microfone</button>
                <button id="btnAudio" onclick="toggleRemoteAudio()">🔈 Mutar Amigo</button>
                <button id="btnScreen" onclick="shareScreen()">💻 Transmitir Tela</button>
            </div>

            <div class="volume-control" id="micVolumeBox" style="display: none;">
                <label for="micVolume">🔊 Volume da Voz do Amigo:</label>
                <input type="range" id="micVolume" min="0" max="1" step="0.05" value="1" oninput="changeMicVolume(this.value)">
            </div>

            <div class="video-grid">
                <div class="video-box" id="boxLocal" style="display: none;">
                    <h3>Sua Transmissão</h3>
                    <video id="localVideo" autoplay playsinline muted></video>
                </div>

                <div class="video-box" id="boxRemote" style="display: none;">
                    <h3>Transmissão do Amigo</h3>
                    <!-- Trocado para rodar o vídeo corretamente sem travar -->
                    <video id="remoteVideo" autoplay playsinline></video>
                    <div class="volume-control">
                        <label for="screenVolume">🎵 Volume da Live:</label>
                        <input type="range" id="screenVolume" min="0" max="1" step="0.05" value="1" oninput="changeScreenVolume(this.value)">
                    </div>
                </div>
            </div>

            <audio id="remoteAudio" autoplay></audio>
        </div>
    </div>

    <script>
        let peer = null;
        let localMicStream = null;
        let localScreenStream = null;
        let connectedPeers = new Set();
        
        let micMuted = false;
        let remoteMuted = false;

        // Configuração robusta para evitar quedas de conexão
        const peerConfig = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' }
                ]
            },
            debug: 2
        };

        // Verifica a URL logo que a página carrega
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const roomToJoin = urlParams.get('room');
            if (roomToJoin) {
                // Se tem link de sala, pula o lobby e entra direto
                startApp(roomToJoin);
            }
        };

        function updateStatus(msg, type = 'normal') {
            const statusEl = document.getElementById('status');
            statusEl.innerText = msg;
            if (type === 'success') statusEl.className = 'text-success';
            else if (type === 'error') statusEl.className = 'text-error';
            else statusEl.className = '';
        }

        async function startApp(roomToJoin) {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('room').style.display = 'block';

            // Pede o microfone antes de tudo
            try {
                localMicStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            } catch (err) {
                alert("Microfone bloqueado! O aplicativo precisa de áudio para funcionar corretamente.");
                // Cria áudio vazio para não quebrar o código
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const dst = ctx.createMediaStreamDestination();
                localMicStream = dst.stream;
            }

            // Inicia o PeerJS
            peer = new Peer(peerConfig);

            peer.on('open', (id) => {
                // Se eu acabei de criar a sala
                if (!roomToJoin) {
                    const inviteUrl = window.location.origin + window.location.pathname + "?room=" + id;
                    document.getElementById('inviteLink').value = inviteUrl;
                    updateStatus("✅ Sala criada! Envie o link acima para convidar.", "success");
                } 
                // Se eu entrei pelo link do amigo
                else {
                    const inviteUrl = window.location.origin + window.location.pathname + "?room=" + roomToJoin;
                    document.getElementById('inviteLink').value = inviteUrl;
                    updateStatus("🔄 Conectando à sala do amigo...", "normal");
                    connectToHost(roomToJoin);
                }
            });

            // Previne quedas: Reconecta ao servidor automaticamente se a net piscar
            peer.on('disconnected', () => {
                updateStatus("⚠️ Oscilação de rede detectada, reconectando...", "error");
                peer.reconnect();
            });

            // Recebendo ligação (seja voz ou tela)
            peer.on('call', (call) => {
                connectedPeers.add(call.peer);
                call.answer(localMicStream); // Responde entregando a própria voz
                
                handleIncomingStream(call);

                // Se eu já estiver compartilhando tela, envio para quem acabou de entrar
                if (localScreenStream) {
                    setTimeout(() => {
                        // METADATA: Salva o tipo de chamada para o navegador não confundir tela com áudio
                        peer.call(call.peer, localScreenStream, { metadata: { type: 'screen' } });
                    }, 1500);
                }
            });

            peer.on('error', (err) => {
                console.error(err);
                if (err.type === 'peer-unavailable') {
                    updateStatus("❌ A sala não existe mais ou o anfitrião saiu.", "error");
                } else {
                    updateStatus("❌ Erro: " + err.type, "error");
                }
            });
        }

        // Função do CONVIDADO ligando para o DONO da sala
        function connectToHost(hostId) {
            connectedPeers.add(hostId);
            // Liga para a pessoa informando que é chamada de VOZ
            const call = peer.call(hostId, localMicStream, { metadata: { type: 'voice' } });
            
            if (call) {
                handleIncomingStream(call);
            } else {
                updateStatus("❌ Falha ao tentar conectar.", "error");
            }
        }

        // O SEGREDO DA TELA PRETA RESOLVIDO: Separar a mídia corretamente
        function handleIncomingStream(call) {
            call.on('stream', (remoteStream) => {
                
                // Se a ligação for identificada como "TELA"
                if (call.metadata && call.metadata.type === 'screen') {
                    updateStatus("🟢 Assistindo transmissão!", "success");
                    const videoObj = document.getElementById('remoteVideo');
                    videoObj.srcObject = remoteStream;
                    document.getElementById('boxRemote').style.display = 'block';
                    
                    // Força a execução do vídeo para evitar tela preta travada
                    videoObj.play().catch(e => console.warn("Aguardando interação para tocar o vídeo."));
                } 
                
                // Se a ligação for de VOZ (Ou seja, não é tela)
                else {
                    updateStatus("🟢 Conectado! O áudio está rodando.", "success");
                    const audioObj = document.getElementById('remoteAudio');
                    audioObj.srcObject = remoteStream;
                    document.getElementById('micVolumeBox').style.display = 'flex';
                }
            });

            call.on('close', () => {
                // Se a ligação caiu
                if (call.metadata && call.metadata.type === 'screen') {
                    document.getElementById('boxRemote').style.display = 'none';
                } else {

### O Link Fixo no GitHub (GitHub Pages)

O GitHub Pages é excelente para hospedar a interface (frontend) do seu projeto de forma gratuita e fixa. O formato do seu link geral será sempre: 
`https://[seu-usuario].github.io/[nome-do-repositorio]/`

**Importante:** O GitHub Pages suporta apenas arquivos estáticos (HTML, CSS e JavaScript no lado do cliente). Como salas de voz e vídeo exigem troca de dados em tempo real (WebRTC, WebSockets), você precisará que o seu código JavaScript no GitHub se conecte a um servidor externo (como Node.js hospedado no Render/Railway) ou use um serviço de terceiros (como **LiveKit**, **Agora.io** ou **PeerJS**).

### Por que a tela fica preta e a conexão cai?

Quando estamos lidando com WebRTC e transmissões ao vivo, esses são os suspeitos mais comuns para os problemas que você descreveu:

*   **Falta de Servidores TURN:** Se a conexão cai de repente ou nem inicia em redes diferentes, é quase certeza que falta configurar um servidor TURN para retransmitir a conexão quando o P2P direto falha.
*   **Permissões de Mídia:** O navegador bloqueia o vídeo se o usuário não conceder permissão clara para uso da câmera e microfone, resultando em tela preta.
*   **Anexo do MediaStream:** O código pode estar recebendo o vídeo, mas falhando ao atribuir o `srcObject` à tag `<video>` no HTML.
*   **Queda do Signaling (WebSocket):** O servidor responsável por apresentar um usuário ao outro perdeu a conexão, derrubando o link da sala.
